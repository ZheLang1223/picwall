<style>
  html, body { height: 100%; }
  body { overflow: hidden; }
  .dark body { background:#121110; color:#e7e2d8; }
  body { background:#f7f3ea; color:#29241c; }
  .display { font-family:'Songti SC','Noto Serif SC','STSong',Georgia,serif; }
  ::-webkit-scrollbar { width:9px; height:9px; }
  ::-webkit-scrollbar-thumb { background:#4a443a; border-radius:5px; border:2px solid transparent; background-clip:content-box; }
  html:not(.dark) ::-webkit-scrollbar-thumb { background:#d8cdb8; background-clip:content-box; }

  /* 三栏工作台 */
  #workbench { display:flex; height:calc(100vh - 49px); }
  .col { overflow-y:auto; overscroll-behavior:contain; }
  #left { width:20%; min-width:230px; border-right:1px solid rgba(245,158,11,.18); }
  #center { width:45%; min-width:420px; border-right:1px solid rgba(245,158,11,.18); }
  #right { flex:1; }
  .col-pad { padding:16px; }

  /* 左栏导航树 */
  .nav-group-title { display:flex; align-items:center; gap:8px; margin:14px 0 4px;
    font-size:11px; letter-spacing:.18em; color:rgba(245,158,11,.85); font-weight:600; }
  html:not(.dark) .nav-group-title { color:#b45309; }
  .nav-item { display:flex; align-items:baseline; gap:8px; width:100%; text-align:left;
    padding:5px 8px; border-radius:4px; cursor:pointer; font-size:13px; color:inherit;
    background:none; border:0; transition:background .12s; }
  .nav-item:hover { background:rgba(245,158,11,.07); }
  .nav-item.on { background:rgba(245,158,11,.13); box-shadow:inset 2px 0 0 #f59e0b; }
  .nav-item .mono { font-family:ui-monospace,SF Mono,Menlo,monospace; font-size:12.5px; }

  /* 状态高亮 */
  .state-item.on .mono { color:#fbbf24; }
  html:not(.dark) .state-item.on .mono { color:#b45309; }
  .hl-atlas .nodeShape, .hl-atlas rect, .hl-atlas circle, .hl-atlas polygon, .hl-atlas path.line
    { stroke:#fbbf24 !important; stroke-width:2.4px !important; }
  .hl-atlasLabel { outline:1px solid rgba(245,158,11,.6); border-radius:3px; padding:0 2px; }
  .legend-dot { display:inline-block; width:9px; height:9px; border-radius:2px; background:#f59e0b; }

  /* 中栏 */
  .flow-tab-active { color:#fbbf24 !important; border-color:rgba(245,158,11,.6) !important; box-shadow: inset 0 -2px 0 #f59e0b; }
  html:not(.dark) .flow-tab-active { color:#b45309 !important; border-color:rgba(180,83,9,.6) !important; box-shadow: inset 0 -2px 0 #d97706; }
  .flow-panel { border:1px solid rgba(245,158,11,.22); border-radius:6px; background:linear-gradient(180deg, rgba(245,158,11,.05), transparent 34%), #171512; box-shadow: inset 0 0 46px rgba(0,0,0,.45); }
  html:not(.dark) .flow-panel { background:#fffdf8; box-shadow:none; }
  .flow-box svg { max-width:none; height:auto; }
  .flow-box .hl-atlas .nodeShape, .flow-box .hl-atlas rect, .flow-box .hl-atlas circle { stroke:#fbbf24 !important; stroke-width:2.4px !important; }

  /* 右栏 Inspector */
  .sec-title { font-size:11px; letter-spacing:.22em; font-weight:600; margin-bottom:8px; color:rgba(245,158,11,.9); }
  html:not(.dark) .sec-title { color:#b45309; }
  .rule-table { width:100%; border-collapse:collapse; font-size:12.5px; line-height:1.55; }
  .rule-table th { text-align:left; padding:6px 8px; border:1px solid rgba(245,158,11,.3);
    background:rgba(245,158,11,.08); font-weight:600; white-space:nowrap; }
  .rule-table td { padding:6px 8px; border:1px solid rgba(245,158,11,.16); vertical-align:top; }
  html:not(.dark) .rule-table th { border-color:rgba(146,104,14,.35); background:rgba(217,119,6,.08); }
  html:not(.dark) .rule-table td { border-color:rgba(146,104,14,.22); }
  .calltree { font-family:ui-monospace,SF Mono,Menlo,monospace; font-size:12px; line-height:1.75;
    white-space:pre-wrap; word-break:break-all; }
  .tradeoff { border:1px solid rgba(245,158,11,.16); border-radius:6px; padding:12px 14px; margin-bottom:10px; }
  html:not(.dark) .tradeoff { border-color:rgba(146,104,14,.3); background:#fffdf8; }
  .tradeoff h5 { font-size:13px; font-weight:700; margin-bottom:6px; }
  .tradeoff dl { display:grid; grid-template-columns:64px 1fr; gap:4px 10px; font-size:12.5px; line-height:1.6; }
  .tradeoff dt { opacity:.55; }
  .chip { display:inline-block; font-size:11px; font-family:ui-monospace,Menlo,monospace;
    padding:1px 6px; margin:1px 2px; border-radius:4px; border:1px solid rgba(245,158,11,.4);
    color:inherit; background:none; cursor:pointer; }
  .chip:hover { background:rgba(245,158,11,.12); }
  .chip-static { cursor:default; }
  mark { background:#fbbf24; color:#1c1917; border-radius:1px; padding:0 1px; }
  html:not(.dark) mark { background:#fde68a; color:#78350f; }
  .vscode { font-size:11px; padding:1px 6px; border:1px solid rgba(245,158,11,.5); border-radius:4px;
    font-family:ui-monospace,Menlo,monospace; white-space:nowrap; }
  .vscode:hover { background:rgba(245,158,11,.12); }
  #search-overlay input { border-color:rgba(245,158,11,.4); }
  #search-results { border-color:rgba(245,158,11,.25); }
  .search-hit:hover { background:rgba(245,158,11,.07) !important; }
</style>

<body class="font-sans antialiased">

<header class="h-[49px] px-4 flex items-center gap-4 border-b" style="border-bottom:3px double rgba(245,158,11,.4)">
  <div class="flex items-baseline gap-2.5">
    <span class="display text-lg font-bold tracking-wide">PWALL</span>
    <span class="display text-lg opacity-70">架构图谱工作台</span>
    <span class="hidden lg:inline text-[10px] tracking-[.3em] opacity-40 uppercase pb-0.5">project atlas workbench</span>
  </div>
  <span id="baseline-chip" class="text-[11px] px-2 py-0.5 border rounded-sm font-mono -rotate-2 text-accent-600 dark:text-accent-400" style="border-color:rgba(245,158,11,.5)"></span>
  <div class="flex-1"></div>
  <button id="btn-search" class="text-xs px-3 py-1.5 rounded-sm border flex items-center gap-2 opacity-80 hover:opacity-100" style="border-color:rgba(245,158,11,.3)">
    <span>检索</span><kbd class="text-[10px] px-1.5 py-0.5 rounded-sm border font-mono" style="border-color:rgba(245,158,11,.4)">/</kbd>
  </button>
  <button id="btn-theme" class="text-xs px-3 py-1.5 rounded-sm border opacity-80 hover:opacity-100" style="border-color:rgba(245,158,11,.3)">Theme</button>
</header>

<div id="workbench">
  <aside id="left" class="col"><div class="col-pad" id="nav-tree"></div></aside>
  <section id="center" class="col">
    <div class="col-pad">
      <div class="flex items-center gap-1 flex-wrap pb-3">
        <div id="center-tabs" class="flex gap-1 flex-wrap"></div>
        <div class="flex-1"></div>
        <div id="zoomers" class="hidden items-center gap-1">
          <button id="zoom-out" class="w-7 h-7 rounded-md border text-sm" style="border-color:rgba(245,158,11,.3)">−</button>
          <button id="zoom-reset" class="w-7 h-7 rounded-md border text-xs" style="border-color:rgba(245,158,11,.3)">1:1</button>
          <button id="zoom-in" class="w-7 h-7 rounded-md border text-sm" style="border-color:rgba(245,158,11,.3)">+</button>
        </div>
      </div>
      <div id="center-body"></div>
    </div>
  </section>
  <aside id="right" class="col"><div class="col-pad" id="inspector"></div></aside>
</div>

<div id="search-overlay" class="fixed inset-0 z-50 hidden">
  <div class="max-w-2xl mx-auto mt-20 px-4">
    <input id="search-input" type="text" placeholder="检索模块 / 状态字段 / 任务 / 概念…"
           class="w-full px-4 py-3 rounded-sm border bg-transparent outline-none text-sm">
    <div id="search-results" class="mt-2 rounded-sm border overflow-hidden divide-y"></div>
    <div class="mt-2 text-xs opacity-50 px-1">Enter 打开首项 · Esc 关闭</div>
  </div>
</div>

<script>
const DATA = JSON.parse(document.getElementById('atlas-data').textContent);
const $ = (s, el=document) => el.querySelector(s);
// abs_root 是本机 vscode 深链基地址：仓库里存空值（不同人 clone 路径不同），
// 本地想要跳转 IDE 就在此字段填仓库绝对路径；为空时降级为纯文本展示。
const vscode = (file, line) => DATA.meta.abs_root ? `vscode://file/${DATA.meta.abs_root}/${file}${line ? ':'+line : ''}` : '';
const escHtml = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const MOD_BY_ID = Object.fromEntries(DATA.modules.map(m => [m.id, m]));
let currentModule = null, currentFlow = 'topology', zoom = 1, hlState = null, lastFocus = null;

/* ---------- 主题 ---------- */
$('#baseline-chip').textContent = DATA.meta.baseline;
const applyTheme = dark => {
  document.documentElement.classList.toggle('dark', dark);
  $('#btn-theme').textContent = dark ? '🌙 Dark' : '☀️ Light';
  localStorage.setItem('atlas-theme', dark ? 'dark' : 'light');
};
$('#btn-theme').onclick = () => {
  const dark = !document.documentElement.classList.contains('dark');
  applyTheme(dark);
  if (currentFlow) renderCenter(currentFlow);
};
applyTheme((localStorage.getItem('atlas-theme') || 'dark') === 'dark');

/* ---------- 文本加工：S.xxx / @模块.符号 / 模块文件名 → 可点 Chip ---------- */
const STATE_NAMES = DATA.states.map(s => s.name).sort((a,b)=>b.length-a.length);
function linkify(text) {
  let out = escHtml(text);
  out = out.replace(/@([a-z_]+)\.([A-Za-z_][A-Za-z0-9_]*)/g, (m, mid, sym) =>
    MOD_BY_ID[mid] ? `<button class="chip" data-inspect="${mid}">@${mid}.${sym}</button>` : m);
  for (const sn of STATE_NAMES) {
    const re = new RegExp(sn.replace('.', '\\.') + '\\b', 'g');
    out = out.replace(re, `<button class="chip" data-state="${sn}">${sn}</button>`);
  }
  for (const m of DATA.modules) {
    if (!m.file) continue;
    const base = m.file.split('/').pop();
    const re = new RegExp('(\\b' + base.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\b)(?![^<]*<\/button>)', 'g');
    out = out.replace(re, `<button class="chip chip-static" data-inspect="${m.id}">${base}</button>`);
  }
  return out;
}
document.addEventListener('click', e => {
  const ins = e.target.closest('[data-inspect]');
  if (ins) { const m = MOD_BY_ID[ins.dataset.inspect]; if (m) { inspect(m.id); return; } }
  const st = e.target.closest('[data-state]');
  if (st) { const s = DATA.states.find(x => x.name === st.dataset.state); if (s) { highlightState(s); showStateInspector(s); } }
});

/* ---------- 左栏导航树 ---------- */
const LAYERS = DATA.layers;
function renderNav() {
  let html = '';
  for (const layer of LAYERS) {
    if (layer.id === 'tasks') {
      html += `<div class="nav-group-title display">任务入口</div>`;
      html += DATA.tasks.map((t,i)=>`<button class="nav-item" onclick="openTask('${t.id}')"><span class="mono opacity-60">T${String(i+1).padStart(2,'0')}</span><span>${escHtml(t.name)}</span></button>`).join('');
      continue;
    }
    if (layer.id === 'concepts') {
      html += `<div class="nav-group-title display">概念前提</div>`;
      html += DATA.concepts.map((c,i)=>`<button class="nav-item" onclick="openConcept('${c.id}')"><span class="mono opacity-60">C${String(i+1).padStart(2,'0')}</span><span>${escHtml(c.name)}</span></button>`).join('');
      continue;
    }
    const mods = DATA.modules.filter(m => m.layer === layer.id);
    if (!mods.length) continue;
    html += `<div class="nav-group-title display">${escHtml(layer.name)}</div>`;
    html += mods.map(m => `<button class="nav-item" data-mid="${m.id}" onclick="inspect('${m.id}')"><span class="mono">${escHtml(m.name)}</span></button>`).join('');
  }
  html += `<div class="nav-group-title display">状态追踪（点击高亮读写方）</div>`;
  html += DATA.states.map((s,i) =>
    `<button class="nav-item state-item" data-state-idx="${i}" onclick="stateClick(${i})"><span class="mono">${escHtml(s.name)}</span></button>`).join('');
  $('#nav-tree').innerHTML = html;
}
window.stateClick = function(i) {
  const s = DATA.states[i];
  highlightState(s);
  showStateInspector(s);
};

/* ---------- 中栏三签 ---------- */
const TABS = [
  { id:'topology', name:'拓扑与依赖注入' },
  { id:'pipeline', name:'数据流与状态机' },
  { id:'mechanics', name:'跨模块工程机制' }
];
function renderTabs() {
  $('#center-tabs').innerHTML = TABS.map(t =>
    `<button data-tab="${t.id}" class="flow-tab px-3 py-1.5 rounded-sm text-sm border transition ${t.id===currentFlow?'flow-tab-active font-semibold':''}"
      style="border-color:rgba(245,158,11,.25)">${t.name}</button>`).join('');
  document.querySelectorAll('.flow-tab').forEach(b => b.onclick = () => { currentFlow = b.dataset.tab; renderTabs(); renderCenter(currentFlow); });
}
const mermaidTheme = () => document.documentElement.classList.contains('dark') ? 'dark' : 'default';
async function renderMermaid(container, code) {
  if (!window.mermaid) { container.innerHTML = `<pre class="text-xs whitespace-pre-wrap opacity-70">${escHtml(code)}</pre>`; return; }
  mermaid.initialize({ startOnLoad:false, theme: mermaidTheme(), securityLevel:'loose', flowchart:{ htmlLabels:true } });
  try {
    const { svg } = await mermaid.render('g-'+Math.random().toString(36).slice(2), code);
    container.innerHTML = `<div class="origin-top-left block w-full" style="transform:scale(${zoom})">${svg}</div>`;
    if (hlState) paintHighlight();
  } catch(e) { container.innerHTML = `<pre class="text-xs whitespace-pre-wrap opacity-70">${escHtml(String(e && e.message || e))}\n\n${escHtml(code)}</pre>`; }
}
function tableHtml(t) {
  return `<div class="mb-5"><div class="sec-title">${escHtml(t.title)}</div>
    <div style="overflow-x:auto"><table class="rule-table">
    <thead><tr>${t.headers.map(h=>`<th>${escHtml(h)}</th>`).join('')}</tr></thead>
    <tbody>${t.rows.map(r=>`<tr>${r.map(c=>`<td>${linkify(c)}</td>`).join('')}</tr>`).join('')}</tbody>
    </table></div></div>`;
}
function renderCenter(tab) {
  const zoomers = $('#zoomers');
  if (tab === 'topology' || tab === 'pipeline') {
    zoomers.className = 'flex items-center gap-1';
    $('#center-body').innerHTML = `<div class="flow-panel"><div id="flow-box" class="flow-box p-4 overflow-auto" style="max-height:calc(100vh - 190px)"></div></div>
      ${tab==='topology' ? apiMapHtml() : ''}`;
    renderMermaid($('#flow-box'), DATA.diagrams[tab]);
    return;
  }
  if (tab === 'mechanics') {
    zoomers.className = 'hidden items-center gap-1';
    $('#center-body').innerHTML = DATA.mechanics.map(m => `
      <div class="mb-8 fade-in">
        <h3 class="display text-base font-bold mb-2">${escHtml(m.title)}</h3>
        <p class="text-[13px] leading-relaxed opacity-80 mb-3">${escHtml(m.scenario)}</p>
        ${m.mermaid ? `<div class="flow-panel mb-4"><div class="flow-box p-4 overflow-auto" data-mech="${m.id}"></div></div>` : ''}
        ${(m.tables||[]).map(tableHtml).join('')}
      </div>`).join('');
    DATA.mechanics.forEach(m => {
      if (m.mermaid) { const box = document.querySelector(`[data-mech="${m.id}"]`); if (box) renderMermaid(box, m.mermaid); }
    });
    return;
  }
}
function apiMapHtml() {
  const a = DATA.apiMap;
  return `<div class="mt-5 mb-2"><div class="sec-title">前端模块 → 后端端点映射</div>
    <div style="overflow-x:auto"><table class="rule-table">
    <thead><tr><th style="width:170px">前端模块</th><th style="width:320px">端点（方法 · 路径）</th><th>触发场景</th></tr></thead>
    <tbody>${a.rows.map(r=>`<tr><td>${linkify(r[0])}</td><td class="font-mono text-[11.5px]">${escHtml(r[1])}</td><td>${escHtml(r[2])}</td></tr>`).join('')}</tbody></table></div>
    <div class="sec-title mt-4">后端独有路由（前端 static JS 未调用）</div>
    <div style="overflow-x:auto"><table class="rule-table">
    <thead><tr><th style="width:420px">端点</th><th>调用方 / 说明</th></tr></thead>
    <tbody>${a.backendOnly.map(r=>`<tr><td class="font-mono text-[11.5px]">${escHtml(r[0])}</td><td>${escHtml(r[1])}</td></tr>`).join('')}</tbody></table></div>
    <p class="text-xs opacity-60 mt-2">${escHtml(a.note)}</p></div>`;
}
$('#zoom-in').onclick = () => { zoom = Math.min(2.5, zoom+0.15); renderCenter(currentFlow); };
$('#zoom-out').onclick = () => { zoom = Math.max(0.4, zoom-0.15); renderCenter(currentFlow); };
$('#zoom-reset').onclick = () => { zoom = 1; renderCenter(currentFlow); };
renderTabs(); renderCenter(currentFlow);

/* ---------- 状态高亮（中栏拓扑 + 左栏标记） ---------- */
function paintHighlight() {
  if (!hlState) return;
  const refs = [...new Set([...(hlState.writers||[]), ...(hlState.readers||[])])];
  for (const id of refs) {
    const el = document.querySelector(`#flow-box g[id*="-${id}-"]`);
    if (el) el.classList.add('hl-atlas');
  }
}
function clearHighlight() {
  document.querySelectorAll('.hl-atlas').forEach(el => el.classList.remove('hl-atlas'));
  document.querySelectorAll('.state-item.on').forEach(el => el.classList.remove('on'));
  hlState = null;
}
function highlightState(st) {
  clearHighlight();
  hlState = st;
  if (currentFlow !== 'topology') { currentFlow = 'topology'; renderTabs(); renderCenter('topology'); }
  else paintHighlight();
  const item = document.querySelector(`[data-state-name="${st.name}"]`);
  if (item) item.classList.add('on');
}

/* ---------- 右栏 Inspector ---------- */
function showDrawerLike(html) { $('#inspector').innerHTML = html; $('#right').scrollTop = 0; }
function sec(title, inner) { return `<section class="mb-6"><div class="sec-title">${escHtml(title)}</div>${inner}</section>`; }
function ioChips(m) {
  const row = (label, arr) => arr && arr.length
    ? `<div class="text-xs mb-1.5"><span class="opacity-50 mr-1.5">${label}</span>${arr.map(r=>`<button class="chip" data-ref="${escHtml(r)}">${escHtml(r)}</button>`).join('')}</div>` : '';
  return row('上游', m.upstream) + row('下游', m.downstream)
    + row('读状态', m.readsState) + row('写状态', m.writesState);
}
window.inspect = function(id) {
  const m = MOD_BY_ID[id]; if (!m) return;
  currentModule = m; clearHighlight();
  let html = `<div class="text-xs opacity-50 mb-1">${escHtml(m.layer)}${m.file ? ' · ' + (vscode(m.file) ? '<a class="vscode" href="'+vscode(m.file)+'">↗ '+escHtml(m.file)+'</a>' : '↗ '+escHtml(m.file)) : ''}</div>
    <h2 class="display text-xl font-bold tracking-wide mb-3">${escHtml(m.name)}</h2>
    <p class="text-[13.5px] leading-relaxed opacity-90 mb-5">${escHtml(m.summary)}</p>
    <div class="mb-5">${ioChips(m)}</div>`;
  if (m.l1_tradeoffs && m.l1_tradeoffs.length)
    html += sec('L1 · 架构定位与第一性权衡', m.l1_tradeoffs.map(t => `
      <div class="tradeoff"><h5>${escHtml(t.title)}</h5><dl>
      <dt>客观约束</dt><dd>${linkify(t.constraint)}</dd>
      <dt>常规方案缺陷</dt><dd>${linkify(t.rejected)}</dd>
      <dt>架构权衡与收益</dt><dd>${linkify(t.decision)}</dd></dl></div>`).join(''));
  if (m.l2_contracts && m.l2_contracts.length)
    html += sec('L2 · 对外公共契约', `<div style="overflow-x:auto"><table class="rule-table">
      <thead><tr><th>接口</th><th>类型签名</th><th>职责与返回值语义</th><th>副作用与异常</th><th></th></tr></thead>
      <tbody>${m.l2_contracts.map(c=>`<tr><td class="font-mono font-semibold text-[12px] whitespace-nowrap">${escHtml(c.name)}</td>
        <td class="font-mono text-[11.5px]">${escHtml(c.signature)}</td><td>${linkify(c.role)}</td>
        <td>${linkify(c.sideEffects)}</td>
        <td>${vscode(c.file, c.line) ? '<a class="vscode" href="'+vscode(c.file, c.line)+'">↗ '+c.line+'</a>' : '↗ '+c.line}</td></tr>`).join('')}</tbody></table></div>`);
  if (m.l2_callTree)
    html += sec('L2 · 内部控制流调用树', `<div class="calltree rounded-md border p-3" style="border-color:rgba(245,158,11,.18)">${linkify(m.l2_callTree)}</div>`);
  if (m.l3_tables && m.l3_tables.length)
    html += m.l3_tables.map(tableHtml).join('');
  showDrawerLike(html);
  markNav(m.id);
};
function markNav(id) {
  document.querySelectorAll('.nav-item.on').forEach(el => el.classList.remove('on'));
  document.querySelectorAll(`.nav-item[data-mid="${id}"]`).forEach(el => el.classList.add('on'));
}
window.openTask = function(id) {
  const t = DATA.tasks.find(x=>x.id===id); if (!t) return;
  let html = `<div class="text-xs opacity-50 mb-1">任务 · 动手前先读完这一张</div>
    <h2 class="display text-xl font-bold mb-3">${escHtml(t.name)}</h2>
    <p class="text-[13.5px] leading-relaxed opacity-90 mb-5">${escHtml(t.goal)}</p>`;
  html += sec('STEPS · 按顺序做', `<ol class="text-sm leading-relaxed space-y-3 list-none">${t.steps.map((s,i)=>
    `<li class="flex gap-2"><span class="font-mono text-xs opacity-40 pt-0.5">${String(i+1).padStart(2,'0')}</span>
     <div><div>${escHtml(s.text)}</div>${s.refs&&s.refs.length?`<div class="mt-1.5 flex flex-wrap gap-1.5">${s.refs.map(r=>`<button class="chip" data-inspect="${r}">→ ${escHtml((MOD_BY_ID[r]||{}).name||r)}</button>`).join('')}</div>`:''}</div></li>`).join('')}</ol>`);
  html += sec('DONE · 完成的定义', `<ul class="text-sm space-y-1.5">${t.done.map(d=>`<li class="flex gap-2"><span class="text-accent-500">✓</span><span class="opacity-85">${escHtml(d)}</span></li>`).join('')}</ul>`);
  showDrawerLike(html);
};
window.openConcept = function(id) {
  const c = DATA.concepts.find(x=>x.id===id); if (!c) return;
  const where = c.where || [];
  let html = `<div class="text-xs opacity-50 mb-1">概念 · 看懂其他卡片的默认前提</div>
    <h2 class="display text-xl font-bold mb-3">${escHtml(c.name)}</h2>
    <p class="text-[13.5px] leading-relaxed opacity-90 mb-5">${escHtml(c.say)}</p>`;
  html += sec('DETAIL · 展开', `<p class="text-sm leading-relaxed opacity-80">${escHtml(c.detail)}</p>`);
  html += sec('WHERE · 在哪体现', `<div class="flex flex-wrap gap-1.5 mb-2">${where.map(w=>w.ref?`<button class="chip" data-inspect="${w.ref}">→ ${escHtml((MOD_BY_ID[w.ref]||{}).name||w.ref)}</button>`:'').join('')}</div>
    <ul class="text-sm opacity-80 space-y-1">${where.map(w=>`<li>· ${escHtml(w.text)}</li>`).join('')}</ul>`);
  showDrawerLike(html);
};
function showStateInspector(st) {
  const writers = (st.writers||[]).map(r=>`<button class="chip" data-inspect="${r}">${escHtml((MOD_BY_ID[r]||{}).name||r)}</button>`).join(' ');
  const readers = (st.readers||[]).map(r=>`<button class="chip" data-inspect="${r}">${escHtml((MOD_BY_ID[r]||{}).name||r)}</button>`).join(' ');
  let html = `<div class="text-xs opacity-50 mb-1">状态追踪 · ${escHtml(st.kind)}</div>
    <h2 class="display text-xl font-bold mb-3">${escHtml(st.name)}</h2>
    <p class="font-mono text-xs opacity-70 mb-3">${escHtml(st.shape)}</p>
    <p class="text-[13.5px] leading-relaxed opacity-90 mb-5">${escHtml(st.desc)}</p>`;
  html += sec('WRITERS · 写入方（拓扑图已高亮）', `<div>${writers || '<span class="opacity-50 text-sm">—</span>'}</div>`);
  html += sec('READERS · 读取方（拓扑图已高亮）', `<div>${readers || '<span class="opacity-50 text-sm">—</span>'}</div>`);
  html += `<button class="text-xs px-3 py-1.5 rounded-sm border opacity-80 hover:opacity-100" style="border-color:rgba(245,158,11,.4)" onclick="clearHighlight()">清除高亮</button>`;
  showDrawerLike(html);
}
window.clearHighlight = clearHighlight;

/* ---------- 检索 ---------- */
const INDEX = [
  ...DATA.modules.map(m => ({ kind:'m', id:m.id, layer:m.layer, name:m.name, role:m.summary,
    hay:(m.name+' '+m.summary+' '+m.layer+' '+(m.tags||'')).toLowerCase() })),
  ...DATA.states.map(s => ({ kind:'s', id:s.name, layer:'状态', name:s.name, role:s.say || s.desc,
    hay:(s.name+' '+s.desc+' '+(s.say||'')).toLowerCase() })),
  ...DATA.tasks.map(t => ({ kind:'t', id:t.id, layer:'任务', name:t.name, role:t.goal,
    hay:(t.name+' '+t.goal+' '+t.steps.map(s=>s.text).join(' ')).toLowerCase() })),
  ...DATA.concepts.map(c => ({ kind:'c', id:c.id, layer:'概念', name:c.name, role:c.say,
    hay:(c.name+' '+c.say+' '+c.detail).toLowerCase() })),
];
let searchOpen = false;
function openSearch() {
  searchOpen = true;
  $('#search-overlay').classList.remove('hidden');
  $('#search-input').value=''; doSearch('');
  setTimeout(()=>$('#search-input').focus(), 30);
}
function closeSearch() { searchOpen = false; $('#search-overlay').classList.add('hidden'); }
function doSearch(q) {
  const query = q.trim().toLowerCase();
  const hits = query ? INDEX.filter(e => e.hay.includes(query)).slice(0,10) : [];
  $('#search-results').innerHTML = hits.map(e => `
    <button class="search-hit w-full text-left px-4 py-3 flex items-center gap-3" style="background:inherit" data-kind="${e.kind}" data-id="${e.id}">
      <span class="text-[10px] px-2 py-0.5 rounded-full border opacity-60 whitespace-nowrap" style="border-color:rgba(245,158,11,.35)">${e.layer}</span>
      <span class="text-sm font-semibold ${e.kind==='m'?'font-mono':''}">${escHtml(e.name)}</span>
      <span class="text-xs opacity-60 truncate flex-1">${escHtml(e.role)}</span>
    </button>`).join('') || (query ? '<div class="px-4 py-3 text-sm opacity-50">无匹配</div>' : '');
  document.querySelectorAll('.search-hit').forEach(b => b.onclick = () => {
    closeSearch();
    const { kind, id } = b.dataset;
    if (kind==='m') inspect(id);
    else if (kind==='t') openTask(id);
    else if (kind==='c') openConcept(id);
    else { const s = DATA.states.find(x=>x.name===id); if (s) { highlightState(s); showStateInspector(s); } }
  });
}
$('#btn-search').onclick = openSearch;
$('#search-input').addEventListener('input', e => doSearch(e.target.value));
$('#search-input').addEventListener('keydown', e => {
  if (e.key==='Enter') { const f = document.querySelector('.search-hit'); if (f) f.click(); }
});
document.addEventListener('keydown', e => {
  if (e.key==='/' && !searchOpen && !/input|textarea/i.test(document.activeElement.tagName)) { e.preventDefault(); openSearch(); }
  if (e.key==='Escape' && searchOpen) closeSearch();
});

renderNav();
</script>
</body>
</html>
