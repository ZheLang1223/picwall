<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PWALL 统计室</title>
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="/static/stats.css?v={{ v }}">
</head>
<body>
<div id="stats">
  <a class="st-back" href="/">← 回相册</a>
  <div class="st-head">
    <h1>PWALL 统计室</h1>
    <small>THE REVIEW LEDGER</small>
  </div>

  <section class="st-section">
    <p class="st-label">总账 · OVERVIEW</p>
    <div class="st-overview" id="st-overview" aria-live="polite"></div>
  </section>

  <section class="st-section">
    <p class="st-label">近 30 天 · 每日入库与回看点赞</p>
    <div id="st-chart-wrap"><div class="st-empty">还没有数据。</div></div>
  </section>

  <section class="st-section">
    <p class="st-label">最勤博主 · 按保留数</p>
    <div class="st-authors" id="st-authors"></div>
  </section>

  <section class="st-section">
    <p class="st-label">最常点赞 · TOP 9</p>
    <div class="st-top-grid" id="st-top"></div>
  </section>

  <section class="st-section">
    <p class="st-label">回看累计 · REVIEW</p>
    <div class="st-review" id="st-review"></div>
  </section>

  <div class="st-footer">
    <span>全部数字来自本地数据库，纯聚合零出网</span>
    <span>点赞次数含保留建账的 ×1</span>
  </div>
</div>
<script type="module" src="/static/stats.js?v={{ v }}"></script>
</body>
</html>
