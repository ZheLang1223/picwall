<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PWALL 统计室</title>
<meta name="color-scheme" content="dark">
<style>
/* 统计室专用样式：独立页，不依赖 style.css；深色固定主题，档案报告气质 */
* { box-sizing: border-box; margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body{
  background:linear-gradient(#14161b, #1d2027); color:#dfe3ea; min-height:100vh;
  font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong",serif;
}
button{ font:inherit; }
img{ display:block; }
a{ color:inherit; }

#stats{ max-width:1080px; margin:0 auto; padding:0 0 44px; }

.st-head{
  padding:30px 26px 18px; border-bottom:1px solid rgba(223,227,234,.14);
  display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap;
}
.st-head h1{ font-size:20px; font-weight:900; letter-spacing:.18em; }
.st-head small{ font-family:Georgia,"Times New Roman",serif; font-style:italic;
  font-size:11px; letter-spacing:.26em; color:#8b93a3; }
.st-back{
  position:fixed; top:12px; right:14px; z-index:3;
  color:#dfe3ea; font-size:12px; letter-spacing:.12em; text-decoration:none;
  background:rgba(0,0,0,.4); border-radius:6px; padding:6px 12px;
}
.st-back:hover{ background:rgba(0,0,0,.6); }

.st-section{ padding:26px 26px 6px; }
.st-label{ font-size:11px; letter-spacing:.3em; color:#8b93a3; margin:0 0 12px; }

/* 总览数字块 */
.st-overview{ display:grid; grid-template-columns:repeat(auto-fill,minmax(118px,1fr)); gap:10px; }
.st-tile{
  background:rgba(255,255,255,.045); border:1px solid rgba(223,227,234,.12);
  border-radius:10px; padding:14px 14px 11px;
}
.st-tile b{ display:block; font-size:26px; font-weight:900; line-height:1.1;
  font-variant-numeric:tabular-nums; }
.st-tile span{ display:block; margin-top:5px; font-size:11px; color:#8b93a3; letter-spacing:.1em; }
.st-tile.hot b{ color:#7db8ec; }
.st-tile.gold b{ color:#e8c672; }

/* 近 30 天柱状图（纯 CSS，零依赖） */
.st-chart{
  display:flex; align-items:flex-end; gap:3px; height:150px;
  background:rgba(0,0,0,.22); border:1px solid rgba(223,227,234,.1);
  border-radius:10px; padding:12px 12px 6px; overflow:hidden;
}
.st-col{ flex:1 1 0; min-width:3px; display:flex; flex-direction:column;
  justify-content:flex-end; gap:2px; height:100%; position:relative; }
.st-col .bar-n{ background:linear-gradient(180deg,#7db8ec,#4a7fb0); border-radius:2px 2px 0 0;
  min-height:1px; }
.st-col .bar-k{ background:rgba(232,198,114,.75); border-radius:2px; min-height:0; }
.st-col .tip{ position:absolute; bottom:calc(100% + 6px); left:50%; transform:translateX(-50%);
  background:#0c0e12; border:1px solid rgba(223,227,234,.2); border-radius:5px;
  padding:4px 8px; font-size:10px; white-space:nowrap; color:#dfe3ea;
  opacity:0; pointer-events:none; transition:opacity .12s; z-index:2; }
.st-col:hover .tip{ opacity:1; }
.st-legend{ display:flex; gap:16px; margin-top:9px; font-size:11px; color:#8b93a3; flex-wrap:wrap; }
.st-legend i{ display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px;
  vertical-align:-1px; }
.st-empty{ border:1.5px dashed rgba(139,147,163,.55); border-radius:10px;
  padding:22px; text-align:center; color:#8b93a3; font-size:12px; }

/* Top 博主 */
.st-authors{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; }
.st-author{
  display:flex; align-items:center; gap:10px;
  background:rgba(255,255,255,.045); border:1px solid rgba(223,227,234,.12);
  border-radius:10px; padding:10px 12px;
}
.st-author img, .st-author .av-ph{ width:38px; height:38px; border-radius:7px; object-fit:cover;
  background:rgba(255,255,255,.08); display:flex; align-items:center; justify-content:center;
  font-size:15px; font-weight:700; color:#8b93a3; flex:none; }
.st-author .nm{ min-width:0; flex:1; }
.st-author .nm b{ display:block; font-size:13px; white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; }
.st-author .nm span{ font-size:10.5px; color:#8b93a3; letter-spacing:.05em; }
.st-author .rank{ font-family:Georgia,serif; font-weight:700; font-size:13px; color:#e8c672;
  width:20px; text-align:center; flex:none; }

/* 最常点赞九宫格 */
.st-top-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; }
.st-top{
  position:relative; border-radius:10px; overflow:hidden;
  border:1px solid rgba(223,227,234,.14); background:rgba(0,0,0,.3);
}
.st-top img, .st-top .ph{ width:100%; aspect-ratio:1/1; object-fit:cover; }
.st-top .ph{ display:flex; align-items:center; justify-content:center; color:#8b93a3; font-size:11px; }
.st-top .kc{ position:absolute; top:7px; right:7px; background:#e8c672; color:#221c0e;
  font-size:11px; font-weight:900; border-radius:999px; padding:2px 9px;
  box-shadow:0 2px 8px rgba(0,0,0,.45); }
.st-top .who{ position:absolute; left:0; right:0; bottom:0; padding:16px 9px 7px;
  background:linear-gradient(transparent, rgba(0,0,0,.72));
  font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.st-review{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }

.st-footer{ margin-top:26px; padding:14px 26px 0; border-top:1px solid rgba(223,227,234,.12);
  font-size:10.5px; color:#8b93a3; letter-spacing:.12em;
  display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; }

@media (max-width:640px){
  .st-head{ padding:24px 16px 14px; }
  .st-section{ padding:20px 16px 4px; }
  .st-footer{ padding:12px 16px 0; }
  .st-back{ position:absolute; }
}
</style>
</head>
<body>
<div id="stats">
  <a class="st-back" href="/">← 回相册</a>
  <div class="st-head">
    <h1>PWALL 统计室</h1>
    <small>THE REVIEW LEDGER</small>
  </div>

  <section class="st-section">
    <p class="st-label">总账 · OVERVIEW</p>
    <div class="st-overview" id="st-overview" aria-live="polite"></div>
  </section>

  <section class="st-section">
    <p class="st-label">近 30 天 · 每日入库与回看点赞</p>
    <div id="st-chart-wrap"><div class="st-empty">还没有数据。</div></div>
  </section>

  <section class="st-section">
    <p class="st-label">最勤博主 · 按保留数</p>
    <div class="st-authors" id="st-authors"></div>
  </section>

  <section class="st-section">
    <p class="st-label">最常点赞 · TOP 9</p>
    <div class="st-top-grid" id="st-top"></div>
  </section>

  <section class="st-section">
    <p class="st-label">回看累计 · REVIEW</p>
    <div class="st-review" id="st-review"></div>
  </section>

  <div class="st-footer">
    <span>全部数字来自本地数据库，纯聚合零出网</span>
    <span>点赞次数含保留建账的 ×1</span>
  </div>
</div>
<script type="module" src="/static/stats.js?v={{ v }}"></script>
</body>
</html>
