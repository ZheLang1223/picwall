<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PWALL 报刊亭</title>
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="/static/kiosk.css?v={{ v }}">
</head>
<body>
<div id="kiosk">
  <a class="ks-back" href="/">← 回相册</a>
  <div class="ks-awning-stripe" role="presentation">
    <div class="ks-sign">
      <b>PWALL 报刊亭</b>
      <i>THE BLOGGER KIOSK</i>
    </div>
  </div>

  <div class="ks-ticker" aria-label="到货快讯">
    <div class="ks-ticker-track" id="ks-ticker"></div>
  </div>

  <section class="ks-controls" aria-label="博主检索与分组管理">
    <div class="ks-ctrl-top">
      <div class="ks-searchbox">
        <input id="ks-search" type="search" placeholder="搜索博主昵称、拼音、@handle 或 UID…" autocomplete="off" spellcheck="false" aria-label="搜索博主">
        <button id="ks-search-clear" type="button" aria-label="清空搜索" hidden>✕</button>
      </div>
      <div class="ks-sort" id="ks-sort" role="group" aria-label="排序方式">
        <button type="button" class="ks-pill on" data-ks-sort="recent">最近更新</button>
        <button type="button" class="ks-pill" data-ks-sort="pinyin">拼音 A–Z</button>
        <button type="button" class="ks-pill" data-ks-sort="count">总期数</button>
        <button type="button" class="ks-pill" data-ks-sort="rate">保留率</button>
      </div>
      <form class="ks-newgrp" id="ks-newgrp-form" hidden>
        <input id="ks-newgrp-input" type="text" placeholder="新建本地分组名…" maxlength="24" autocomplete="off">
        <button type="submit" class="ks-btn-sm">+ 建组</button>
      </form>
    </div>
    <div class="ks-groups" id="ks-groups" role="group" aria-label="按来源与分组筛选"></div>
    <div class="ks-alpha" id="ks-alpha" role="group" aria-label="拼音首字母索引"></div>
  </section>

  <div class="ks-counter" id="ks-counter">
    <p class="ks-counter-label">专栏内页与博主管理 · AUTHOR SPREAD</p>
    <div id="ks-counter-body">
      <div class="ks-counter-empty">点击墙上任意一本杂志，翻开它的专栏内页与管理</div>
    </div>
  </div>

  <div class="ks-wallhead">
    <h2>本期书架</h2>
    <small id="ks-shelf-meta">按最近一期到货排序</small>
  </div>
  <div class="ks-wall" id="ks-wall" aria-live="polite"></div>

  <div class="ks-footer">
    <span>每位博主一本「杂志」——期数即发帖数，好评即保留数</span>
    <span>支持拼音检索、分组过滤、取消关注与本地归组</span>
  </div>
</div>
<div id="ks-toast" class="ks-toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="/static/kiosk.js?v={{ v }}"></script>
</body>
</html>
